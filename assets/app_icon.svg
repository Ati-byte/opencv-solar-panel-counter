<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b3a5c"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e6fa5"/>
      <stop offset="100%" style="stop-color:#0d4a7a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd166"/>
      <stop offset="100%" style="stop-color:#f4a100"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Sun glow in top-right -->
  <circle cx="400" cy="112" r="52" fill="url(#sunGrad)" opacity="0.18"/>
  <circle cx="400" cy="112" r="34" fill="url(#sunGrad)" opacity="0.55"/>
  <circle cx="400" cy="112" r="20" fill="#ffe08a"/>

  <!-- Solar panel array: 4 columns x 3 rows, centered -->
  <!-- Panel background plate -->
  <rect x="68" y="172" width="340" height="228" rx="12" ry="12" fill="#0a2540" opacity="0.7"/>

  <!-- Panel cells: col width=76, col gap=12, row height=60, row gap=12 -->
  <!-- Row 1 -->
  <rect x="80"  y="184" width="72" height="58" rx="6" fill="url(#panelGrad)"/>
  <rect x="164" y="184" width="72" height="58" rx="6" fill="url(#panelGrad)"/>
  <rect x="248" y="184" width="72" height="58" rx="6" fill="url(#panelGrad)"/>
  <rect x="332" y="184" width="72" height="58" rx="6" fill="url(#panelGrad)"/>

  <!-- Row 2 -->
  <rect x="80"  y="254" width="72" height="58" rx="6" fill="url(#panelGrad)"/>
  <rect x="164" y="254" width="72" height="58" rx="6" fill="url(#panelGrad)"/>
  <rect x="248" y="254" width="72" height="58" rx="6" fill="url(#panelGrad)"/>
  <rect x="332" y="254" width="72" height="58" rx="6" fill="url(#panelGrad)"/>

  <!-- Row 3 -->
  <rect x="80"  y="324" width="72" height="58" rx="6" fill="url(#panelGrad)"/>
  <rect x="164" y="324" width="72" height="58" rx="6" fill="url(#panelGrad)"/>
  <rect x="248" y="324" width="72" height="58" rx="6" fill="url(#panelGrad)"/>
  <rect x="332" y="324" width="72" height="58" rx="6" fill="url(#panelGrad)"/>

  <!-- Cell grid lines (horizontal + vertical) per cell -->
  <!-- Row 1 -->
  <line x1="80"  y1="213" x2="152" y2="213" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="116" y1="184" x2="116" y2="242" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="164" y1="213" x2="236" y2="213" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="200" y1="184" x2="200" y2="242" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="248" y1="213" x2="320" y2="213" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="284" y1="184" x2="284" y2="242" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="332" y1="213" x2="404" y2="213" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="368" y1="184" x2="368" y2="242" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <!-- Row 2 -->
  <line x1="80"  y1="283" x2="152" y2="283" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="116" y1="254" x2="116" y2="312" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="164" y1="283" x2="236" y2="283" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="200" y1="254" x2="200" y2="312" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="248" y1="283" x2="320" y2="283" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="284" y1="254" x2="284" y2="312" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="332" y1="283" x2="404" y2="283" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="368" y1="254" x2="368" y2="312" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <!-- Row 3 -->
  <line x1="80"  y1="353" x2="152" y2="353" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="116" y1="324" x2="116" y2="382" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="164" y1="353" x2="236" y2="353" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="200" y1="324" x2="200" y2="382" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="248" y1="353" x2="320" y2="353" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="284" y1="324" x2="284" y2="382" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="332" y1="353" x2="404" y2="353" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>
  <line x1="368" y1="324" x2="368" y2="382" stroke="#4fc3f7" stroke-width="1.2" opacity="0.45"/>

  <!-- Shimmer highlight on top row -->
  <rect x="80"  y="184" width="72" height="14" rx="6" fill="white" opacity="0.06"/>
  <rect x="164" y="184" width="72" height="14" rx="6" fill="white" opacity="0.06"/>
  <rect x="248" y="184" width="72" height="14" rx="6" fill="white" opacity="0.06"/>
  <rect x="332" y="184" width="72" height="14" rx="6" fill="white" opacity="0.06"/>

  <!-- Counter badge bottom-right -->
  <circle cx="394" cy="394" r="58" fill="#0d1b2a" opacity="0.85"/>
  <circle cx="394" cy="394" r="50" fill="#06d6a0"/>
  <!-- Check mark -->
  <polyline points="370,394 386,412 420,374" stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Thin border around whole icon -->
  <rect x="2" y="2" width="508" height="508" rx="95" ry="95" fill="none" stroke="white" stroke-width="3" opacity="0.06"/>
</svg>
